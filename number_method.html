<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a = math.round(10.6); //Round value
        document.write("Round of value: "+ a + "<br>");
        var b = math.trunc(10.6); //Trunc value
        document.write("Trunc round of without decimal prints of value: "+ b+ "<br>");
        var c = math.Ceil(6.09); //ceil value
        document.write("Ceil nearest upper of value: "+ c + "<br>");
        var d = math.floor(6.55); //floor value
        document.write("floor nearest down print of value: "+ d + "<br>");
        var e = math.max(12,1,56,45,85,21);
        document.write("max value: "+ e + "<br>");
        var f = math.min(12,1,56,45,85,21);
        document.write("min value: "+ f + "<br>");
        
    </script>
</body>
</html>
