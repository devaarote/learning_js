<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <!-- Example 1 -->
     <h1>change tect using DOM</h1>

    <!-- example 2 -->
    <h1>change tect using DOM</h1>

    <img src="images/background1.jpg" alt="background" id="myImg" width="300"> 
     <button onclick="Changeimage()">Change image</button>

    <!-- example 4 -->

    <input type="text" id="nameInput" placeholder="Enter name">
     <button onclick="showName()">Submit</button>
     <h1 style="color:red" id="output"></h1>
    <hr>
    <script>

        function showName(){
            let name = getElementById('output').innerHtml="hello is me"=name;

        }
     </script>
    
     <script>

        function Changeimage(){
            document.getElementById('myImg').src ='images/background2.jpg';

        }
     </script>

      <script>

        function Changecolor(){
            document.getElementById('color').style.color='blue';

        }
     </script>


     <script>

        function Changetext(){
            document.getElementById('title').innerHTML='new heading';

        }
     </script>
